<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120d0a" />
    <title>Darts of Fun</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="vignette"></div>

    <header id="hud">
      <div class="card" id="card-0">
        <span class="name" id="name-0">Toi</span>
        <span class="score" id="score-0">201</span>
      </div>
      <div class="card" id="card-1">
        <span class="name" id="name-1">Gérard</span>
        <span class="score" id="score-1">201</span>
      </div>
    </header>

    <p id="info"></p>
    <div id="marks" hidden></div>
    <button id="menuBtn" type="button">Menu</button>

    <section id="status">
      <div id="dots" aria-label="Fléchettes restantes">
        <i></i><i></i><i></i>
      </div>
      <p id="callout"></p>
      <p id="hint"></p>
    </section>

    <p id="help">Fais glisser la fléchette, relâche pour lancer</p>

    <div id="modal" hidden>
      <div class="panel">
        <h1 id="modal-title"></h1>
        <p id="modal-text"></p>
        <p id="modal-coins"></p>
        <div id="modal-actions"></div>
      </div>
    </div>

    <div id="screen" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
